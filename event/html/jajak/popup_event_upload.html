<body>

<div class="popupWrap_admin" id="popupEventUpload">
	<h1>행사등록</h1>
	<div class="popupCon">
		<div class="formArea">
			<form id="" name="" action="" method="post">
				<fieldset>
					<legend>행사등록</legend>
					<table class="inputTbl">
						<colgroup>
							<col style="width: 20%;">
							<col style="width: 80%;">
						</colgroup>
						<tbody>
							<tr>
								<th><label for="">행사명</label></th>
								<td><input type="text" name="" id="" style="width: 90%;"></td>
							</tr>
							<tr>
								<th><label for="">행사장소</label></th>
								<td><input type="text" name="" id="" style="width: 90%;"></td>
							</tr>
							<tr>
								<th>대회 기간</th>
								<td class="period">
									<label for="">시작일 :</label>
									<input type="text" name="" id="">
									<span>~</span>
									<label for="">종료일 : </label>
									<input type="text" name="" id="">
								</td>
							</tr>
							<tr>
								<th>참가신청 기간</th>
								<td class="period">
									<label for="">시작일 :</label>
									<input type="text" name="" id="">
									<span>~</span>
									<label for="">종료일 : </label>
									<input type="text" name="" id="">
								</td>
							</tr>
							<tr>
								<th>참가수정 기간</th>
								<td class="period">
									<label for="">시작일 :</label>
									<input type="text" name="" id="">
									<span>~</span>
									<label for="">종료일 : </label>
									<input type="text" name="" id="">
								</td>
							</tr>
							<tr>
								<th>참가신청비</th>
								<td class="multi">
									<label for="">정회원 : </label>
									<input type="text" name="" id="" style="width: 100px;">
									<span>원</span>
								</td>
							</tr>
						</tbody>
					</table>

					<div class="btn btnArea">
						<input type="submit" value="저장" class="btnDef">
					</div>
				</fieldset>
			</form>
