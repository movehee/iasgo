						<table class="tblDef inputTbl">

									</td>
								</tr>
								<tr>
									<th><label for=""><i class="essen" title="필수"></i> 비밀번호</label></th>

										<input type="password" name="" id="">
										<span class="note">* 6~15자리의 영문소문자, 숫자 조합문자열, 공백·특수문자 불가</span>
									</td>
								</tr>
								<tr>
									<th><label for=""><i class="essen" title="필수"></i> 비밀번호 확인</label></th>

									</td>
								</tr>

								<tr>
									<th><label for=""><i class="essen" title="필수"></i> 대표자명</label></th>
									<td><input type="text" name="" id=""></td>
								</tr>
								<tr>
									<th><label for="">홈페이지 주소</label></th>
									<td><input type="text" name="" id=""></td>
								</tr>
								<tr>
									<th><label for=""><i class="essen" title="필수"></i> 조직형태</label></th>
									<td class="multi">
										<input type="radio" name="" id=""><label for="">도서관</label>
										<input type="radio" name="" id=""><label for="">연구소</label>
										<input type="radio" name="" id=""><label for="">자료실</label>

								</tr>
								<tr>

									<td class="address">

								</tr>

							<colgroup>

							</colgroup>
							<tbody>
								<tr>
									<th><label for=""><i class="essen" title="필수"></i> 성명</label></th>
									<td colspan="3"><input type="text" name="" id=""></td>
								</tr>
								<tr>
									<th><label for=""><i class="essen" title="필수"></i> 부서</label></th>
									<td><input type="text" name="" id=""></td>

									<td><input type="text" name="" id=""></td>
								</tr>
								<tr>
									<th><label for=""><i class="essen" title="필수"></i> 휴대 전화번호</label></th>
									<td colspan="3" class="phone">
										<select name="" id="">
											<option value=""></option>
										</select>
										<span>-</span>
										<input type="text" name="" id="">
										<span>-</span>
										<input type="text" name="" id="">
									</td>
								</tr>
								<tr>

											<option value=""></option>
										</select>

										<input type="text" name="" id="">
										<span>-</span>
										<input type="text" name="" id="">
									</td>
								</tr>
								<tr>
									<th><label for=""><i class="essen" title="필수"></i> E-mail</label></th>
									<td colspan="3" class="email">
										<input type="text" name="" id="">
										<span>@</span>
										<input type="text" name="" id="">
										<select name="" id="">
											<option value=""></option>
										</select>
										<span class="note clear">* 결제정보 및 분야별 관련 소식을 전해드립니다.</span>
									</td>
								</tr>
							</tbody>
						</table>


						<h2>관리자 입력정보</h2>
						<p class="note">※ 관리자입력정보를 수정/등록 입력 후 해당 메모등록 버튼을 클릭하시면 저장 됩니다.</p>

							<colgroup>
								<col style="width: 20%;">
								<col style="width: 80%;">

								<tr>

								</tr>
